# anchor-mc 설정

# 섀도 모드(기본 true): 절대 자동 처벌하지 않는다. 확정되면 로그와 관리자 알림(anchor.alert)만.
# 이 버전에는 처벌 동작이 없어서 false로 바꿔도 똑같이 동작한다.
shadow-mode: true

# 반응 반경 r(블록). 플레이어(또는 캐는 블록)가 뭉치의 가장 가까운 블록 중심에서 이 거리 안에 들어오면 반응 1. 2.5 이상.
reaction-radius: 3.0
# 판정 시간 창(초). 청크가 전송된 뒤 이 시간 안에 반응이 없으면 0으로 확정하고 거둔다.
# 미끼는 청크가 전송될 때 놓이므로 플레이어에게서 멀 수 있다(청크 반경 근처). 도달하려면 시간이 걸리니 넉넉히 둔다.
window-seconds: 240
# 이 거리보다 멀어지면 0으로 확정하고 거둔다(블록). 서버 시야 거리(청크 x 16)보다 커야 의미가 있다.
give-up-distance: 160.0
# 이 거리보다 가까이 오면(정상 플레이에선 불가능) 판정 전이면 증거에서 제외하고 거둔다.
retract-distance: 2.0

# 혼합 e-value 확정 문턱은 E >= 1/alpha.
alpha: 1.0e-9
# p0 = (전체 위약 반응률) x 이 배수. 위약 반응이 0건이면 95% 상한에 곱한다.
p0-multiplier: 2.0
# 위약 관측이 이보다 적으면 p0를 상한(0.9)으로 두어 확정이 사실상 불가능하다.
min-placebo-samples: 100
# 확정 규칙. MIXTURE: p0 기반 대안 혼합만. PAIRED: 쌍 정확 검정만(문턱 1/alpha).
# BOTH(기본): 혼합 E >= 1/alpha 그리고 쌍 정확 E >= 1/paired-alpha. 플레이 방식별 정직 반응률 차이로 혼합이 넘칠 때 쌍 정확 검정이 막는다.
confirm-rule: BOTH
paired-alpha: 1.0e-3

# 미끼 밀도. 청크가 플레이어에게 전송될 때만 (미끼, 위약) 쌍을 만든다. 시간 주기로 새로 만들지 않는다.
sites:
  y-min: -64
  y-max: 16
  # 만들 때 플레이어와 뭉치의 모든 블록 사이 최소 거리(블록). > reaction-radius + 1.
  min-distance: 6.0
  # 플레이어당 동시에 유지하는 쌍의 최대 수와, 쌍 사이 최소 간격(초, 0이면 없음).
  max-active-pairs: 24
  cooldown-seconds: 0
  # 청크 하나가 전송될 때 시도하는 쌍 수의 기댓값(정수부는 반드시, 소수부는 확률). (0, 8].
  pairs-per-chunk: 2.0
  # 진짜 다이아 광맥 표본이 이만큼 모일 때까지 청크를 스캔해 모양·크기·높이 분포를 배운다(0이면 바닐라 기본값만).
  # 표본이 40개 미만인 동안은 바닐라 기본값을 쓴다.
  profile-samples: 600
  # 조건에 맞는 뭉치를 못 찾으면 이만큼 시도하고 포기.
  max-attempts: 60

storage:
  # 플러그인 폴더 안의 SQLite 파일.
  file: anchor.db
