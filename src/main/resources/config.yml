# anchor-mc 설정

# 이 파일의 형식 버전(직접 바꾸지 않는다). 플러그인이 새 버전이 되면 이 숫자가 올라가고, 서버의 config.yml이 더 낮으면 시작·reload 때 콘솔에 경고한다.
# 기본 파일은 이미 있으면 덮어쓰지 않으므로 새 키·바뀐 기본값은 직접 옮겨야 한다(secret-seed를 지우면 모든 미끼 자리가 바뀌니 옮겨 둔다).
config-version: 2

# 섀도 모드(기본 true): 절대 자동 처벌하지 않는다. 확정되면 로그와 관리자 알림(anchor.alert)만.
# 이 버전에는 처벌 동작이 없어서 false로 바꿔도 똑같이 동작한다.
shadow-mode: true

# 반응 반경 r(블록). 플레이어(또는 캐는 블록)가 뭉치의 가장 가까운 블록 중심에서 이 거리 안에 들어오면 반응 1. 2.5 이상.
reaction-radius: 3.0
# 판정 시간 창(초). 미끼가 플레이어 화면에 있던 시간이 이만큼 쌓이는 동안 반응이 없으면 MISS로 판정한다(청크를 버렸다 다시 받아도 시간이 이어진다).
# 판정이 끝나도 미끼는 화면에서 거두지 않는다(저절로 사라지면 단서가 된다). 창 이후의 첫 반응은 '먼저 반응한 쪽' 검정에만 쓴다.
window-seconds: 240
# 이 거리보다 멀어지면 MISS로 판정한다(블록, 화면에서는 거두지 않는다). 서버 시야 거리(청크 x 16)보다 커야 의미가 있다.
give-up-distance: 160.0
# 이 거리보다 가까이 오면(정상 플레이에선 불가능) 판정 전이면 증거에서 제외하고 거둔다.
retract-distance: 2.0

# 확정 문턱은 E >= 1/alpha(PAIRED에서는 먼저 반응한 쪽 E, MIXTURE·BOTH에서는 혼합 E).
alpha: 1.0e-9
# p0 = (전체 위약 반응률) x 이 배수. 위약 반응이 0건이면 95% 상한에 곱한다.
p0-multiplier: 2.0
# 위약 관측이 이보다 적으면 p0를 상한(0.9)으로 두어 확정이 사실상 불가능하다.
min-placebo-samples: 100
# 확정 규칙. PAIRED(기본): 먼저 반응한 쪽 정확 검정만(문턱 1/alpha). 동전으로 정한 (미끼, 위약) 쌍에서 먼저 반응한 쪽이 미끼일 확률이
# 귀무에서 정확히 1/2이라 p0 추정도 계정 내 독립도 필요 없다. 혼합 e-value는 /anchor status에 참고용으로만 보이고 확정에는 안 쓴다.
# MIXTURE: p0 기반 대안 혼합만. BOTH: 혼합 E가 1/alpha, 먼저 반응한 쪽 E가 1/paired-alpha를 각각 한 번이라도 넘음(혼합은 p0 추정과
# 자리 간 독립에 기대는 근사라 정직 오탐을 정확히 묶지 못한다. 3단계 수정으로 순서 부풀림은 없앴지만 검출력이 낮다).
confirm-rule: PAIRED
paired-alpha: 1.0e-3

# 서버 비밀 시드. 어느 청크의 어디에 미끼가 있는지를 (플레이어, 청크, 이 시드)로 결정적으로 정한다.
# 비워 두면 처음 켤 때 새로 만들어 이 파일에 저장한다. 로그나 명령에 절대 출력하지 않는다. 유출되면 미끼 위치를 예측할 수 있다.
# 값을 바꾸면 모든 미끼 자리가 바뀐다(서버를 다시 켜야 적용). 16자 이상 아무 문자열이나 16진수 32자 이상.
secret-seed: ""

# 미끼 밀도. 미끼는 서버가 플레이어에게 청크 데이터 패킷을 보낼 때 그 패킷 안에 직접 들어간다. 한 청크를 다시 받아도 같은 자리에 같은 미끼가 온다.
# 플레이어 위치·동시 개수·쿨다운에 기대지 않는다(결정적이어야 하므로). 밀도는 pairs-per-chunk 하나다.
sites:
  y-min: -64
  y-max: 16
  # 청크 하나를 보낼 때 시도하는 (미끼, 위약) 쌍 수의 기댓값(정수부는 반드시, 소수부는 확률). (0, 8].
  # 조건(봉인·간격·월드 범위)을 못 채우는 자리가 있어 실제 미끼는 이보다 적다. 진짜 다이아 광맥은 청크당 약 4개다.
  # 1.2단계 시뮬레이터: 0.04~0.06은 전 전략 0%, 1은 신뢰100%·검증형만, 2(기본)는 신뢰50%까지, 4는 신뢰20%도 절반. 비용은 README 1.2절.
  pairs-per-chunk: 2.0
  # 진짜 다이아 광맥 표본이 이만큼 모일 때까지 청크를 스캔해 모양·크기·높이 분포를 배운다(0이면 바닐라 기본값만).
  # 표본이 40개 미만인 동안은 바닐라 기본값을 쓴다.
  profile-samples: 600
  # 조건에 맞는 뭉치를 못 찾으면 이만큼 시도하고 포기.
  max-attempts: 60

# 테스트 전용. 실운영에서는 false로 둔다.
debug:
  # true면 관전자 모드 플레이어도 미끼 자격을 잃지 않는다(관전자로 벽 속을 날며 미끼가 보이는지 실서버에서 눈으로 확인하는 용도).
  # 관전자 상태에서의 반응은 증거(e-value)에 넣지 않는다(표시만 유지). 켜면 시작·reload 때 콘솔에 경고, /anchor stats 첫 줄에 표시된다.
  allow-spectator: false

storage:
  # 플러그인 폴더 안의 SQLite 파일.
  file: anchor.db
