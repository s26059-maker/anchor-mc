name: build

on:
  push:
    branches: [main]
  pull_request:

# 읽기 권한만 쓴다(저장소를 바꾸지 않는다).
permissions:
  contents: read

# 같은 브랜치/PR에서 새 실행이 시작되면 이전 실행은 취소한다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradlew를 실행하기 전에 gradle-wrapper.jar가 공식 배포본인지 체크섬으로 검증한다.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      # 단위 테스트와 시뮬레이터 컴파일을 포함한다(test가 compileSimJava에 의존).
      - name: Build (with tests)
        run: ./gradlew build --console=plain

      # 위 단계가 성공했을 때만 실행된다(기본 if: success()).
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: anchor-mc-jar
          path: build/libs/anchor-mc-*.jar
          if-no-files-found: error
          retention-days: 30

      # 테스트가 실패했을 때 원인을 볼 수 있게 보고서를 올린다.
      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
